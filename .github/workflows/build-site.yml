name: Build Site

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/mesurer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-site.yml"
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/mesurer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
